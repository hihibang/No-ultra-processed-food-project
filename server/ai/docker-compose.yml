# 시작: docker compose up -d
# 중지: docker compose stop
# 상태 확인: docker compose ps

name: ai-chatbot

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-rag
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Seoul
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/recipe_docs:/data/recipe_docs
    networks:
      - rag-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-net
    # NVIDIA GPU를 사용 중인 경우 아래 주석을 해제하세요:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  n8n_data:
    name: ai_n8n_data
  qdrant_data:
    name: ai_qdrant_data
  ollama_data:
    name: ai_ollama_data

networks:
  rag-net:
    driver: bridge